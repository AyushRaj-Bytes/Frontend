<!DOCTYPE html>
<html lang="en">
<head>
     <title>More CSS Properties</title>
     <style>
          .head{
               height: 300px;
               width: 600px;
               background-color: yellow;
               font-size: 20px;
               color: black;
               font-weight: bold;
               font-style: oblique;
               text-align: justify;
          }
          .h{
               height: 300px;
               width: 500px;
               background-color: blue;
               color: white;
               font-size: 30px;
               font-weight: bolder;
               font-style: italic;
               text-transform: capitalize;
               word-spacing: 20px;
               text-align: center;
               letter-spacing: 15px;
               
          }
          .anchor{
               text-decoration: none;
          }
     </style>
</head>
<body>
     <div class="h">
          alyzer created by Ayush Raj!
     </div>
     <a href="https://www.youtube.com" class="anchor"><h1>Open Youtube</a>
     <div class="head">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi, 
          voluptatibus eum! Delectus accusantium reiciendis modi aut odit illo, 
          repellat ipsa beatae velit facere tempora nihil.
           </div>
</body>
</html>
