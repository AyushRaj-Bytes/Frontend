<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Box Model</title>
     <style>
          .mbox{
               margin:0;
               padding: 0;
               background-color: aqua;
          }
          .box1{
               color: red;
               padding: 50px;
               margin: 50px;
               border: 50px solid black;
          }
          .box2{
               color: black;
               margin:5px;
               padding: 5px;
               border: 1px solid black;
          }
     </style>
</head>
<body>
     <div class="mbox box1">I am a box</div>
     <div class="mbox box2">I am another box!</div>
</body>
</html>
