<!DOCTYPE html>
<html lang="en">
<head>
     <title>DataLists In HTML</title>
</head>
<body>
     <div>
          <form>
               Course: <input type="text" name="course" list="course" autofocus/>
               <datalist id="course">
                    <option value="HTML">HTML</option>
                    <option value="CSS">CSS</option>
                    <option value="JavaScript">JavaScript</option>

               </datalist>


               <button>Submit</button>

          </form>
     </div>
</body>
</html>
