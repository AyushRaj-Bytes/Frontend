<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Text Shadow In Html</title>
     <style>
          .text{
               text-align: center;
               font-size: 50px;
               /* Text Shadow- (x-axis y-axis blur color) */
               
               /* text-shadow: -5px -5px 10px black; */
               text-shadow: 5px 5px 10px black;
          }
     </style>
</head>
<body>
     <div class="text">
          <h1>
               alyzer
          </h1>
     </div>
</body>
</html>
