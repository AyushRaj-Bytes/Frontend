<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Margin</title>
     <style>
          .mbox{
               height: 100px;
               width: 400px;
               background-color: red;
               color: black;
               border: 5px solid green;
               margin: 5px;
          }
          .box1{
               height: 70px;
               width: 370px;
               margin: 10px;
               background-color: blue;
               color: white;+
               border: 5px solid black;
               text-align: center;
          }
          .box2{
               background-color: yellow;
               height: 40px;
               width: 340px;
               border: 5px solid tomato ;
               margin: 10px 5px 10px 10px; /* Short Hand Margin*/
               color: black;
          }
     </style>
</head>
<body>
     <div class="mbox">
     <div class="box1">
          <div class="box2">
               This is 3rd Box!
          </div>
     </div>
     </div>
</body>
</html>
