<!DOCTYPE html>
<html lang="en">
<head>
     <title>Table Attributes In HTML</title>
</head>
<body>
     <H1 align="center">Table Attributes In HTML</H1>
     <table border="2", align="center" bgcolor="yellow" 
     cellspacing="5" cellpadding="10" height=100 width="0"  >

          <thead><tr bgcolor="green" >
               <th>Course</th>
               <th>Fees</th>
               <th>Duration</th>
          </tr>
          </thead>
          <tbody bgcolor="red," align="center">
               <tr align="center">   
               <td>Web Development</td>
               <td>$999</td>
               <td>3 Months</td>
               </tr>
               <tr>
               <td>Digital Marketing</td>
               <td>$599</td>
               <td>2 Months</td>
               </tr>
               <tr>
               <td>Android Development</td>
               <td>$999</td>
               <td>1 Months</td>
               </tr>
          </tbody>
     </table>
</body>
</html>














<!--
Table Attributes-

1.) table align- align="center/right/left"
2.) table border- 2
3.) table bgcolor="yellow"
4.) table cellspacing="5"
    (Gap outside the table)
5.) table cellpadding="5"
    (Gap inside the table)
6.) Height="300"
7.) Width="100"

-->
