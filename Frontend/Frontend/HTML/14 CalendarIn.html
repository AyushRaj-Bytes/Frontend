<!DOCTYPE html>
<html lang="en">
<head>
     <title>Calendar In HTML</title>
</head>
<body>
     <form>
          <fieldset>
               <legend><H2>Calendar In HTML</H2></legend>
               Date: <input type="date", name="date"> <br><br>
               Time: <input type="time", name="time"> <br><br>
               Date Time: <input type="datetime", name="datetime"> <br><br>
               Month: <input type="month", name="month"> <br><br>
               Week: <input type="week", name="week"> <br><br>
               Range: <input type="range", min="0" max="100" value="30" name="range"> <br><br>

          </fieldset>
     </form>
</body>
</html>
