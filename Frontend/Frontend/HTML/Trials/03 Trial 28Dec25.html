<!DOCTYPE html>
<html lang="en">
<head>
     <title>Forms in HTML</title>
</head>
<body>
     <form>
          <fieldset>
               <legend><h2>Enquiry Form</h2></legend>
               Name: <input type="text", name="name" placeholder="Enter the name..."/><br><br>
               Image: <input type="file" name="image"/><br><br>
               Address: <textarea name="address"></textarea><br><br>
               Gender: <input type="radio" name="gender" value="m"/> Male
                       <input type="radio" name="gender" value="f"/> Female
                       <input type="radio" name="gender" value="o"/> Other <br><br>
               Hobies: <input type="checkbox" name="hobbies"/> HTML
                       <input type="checkbox" name="hobbies"/> CSS
                       <input type="checkbox" name="hobbies"/> JavaScript <br><br>
               Country: <select>
                    <option value="default">Please select your country</option>
                         <optgroup label="ASIA"></optgroup>
                         <option value="India">India</option>
                         <option value="SRL">SriLanka</option>
                         <option value="Korea">Korea</option>
                         <optgroup label="North America"></optgroup>
                         <option value="Korea">USA</option>
                         <option value="Korea">Canada</option>
                         <option value="Korea">Brazil</option>
                         <optgroup label="Europe"></optgroup>
                         <option value="Germany">Germany</option>
                         <option value="France">France</option>
                         <option value="Greece">Greece</option>
               </select><br><br>
               Color: <input type="color" name=""/> <i>Select the color</i><br><br>
               Email: <input type="email" name="email"/><br><br>
               Age: <input type="number" name="ageNumber"/><br><br>
               Password: <input type="password", name="password"/><br><br>
               Hidden: <input type="hidden" name="hidden"/><br><br>
               Date: <input type="date" name="date"/><br><br>
               Time: <input type="time" name="time"/><br><br>
               Month: <input type="month" name="month"/><br><br>
               Datetime: <input type="datetime" name="datetime"/><br><br>
               Week: <input type="week" name="week"/><br><br>
               Range: <input type="range" name="range" min="0" max="100" value="36">

              <br><br> 
              <input type="submit" value="Submit">
              <input type="reset" value="Reset">
          </fieldset>
     </form>
</body>
</html>
