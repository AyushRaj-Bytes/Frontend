<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>CSS Grid</title>
     <style>
          .container{
               width: 500px;
               height: 500px;
               border: 2px solid black;
               margin:auto;
               margin-top: 20px;
               padding: 10px;
               display: grid;
               grid-template-columns: auto auto auto;
               /* grid-column-gap: 10px;
               grid-row-gap: 10px; */
               grid-gap: 10px 10px;


          }
          .container div{
               background-color: yellow;
               text-align: center;
               font-size: 50px;
               border: 1px solid red;
               padding: 40px;

          }
     </style>
</head>
<body>
     <div class="container">
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
     </div>
</body>
</html>
