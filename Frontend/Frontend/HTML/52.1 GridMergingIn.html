<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>CSS Grid</title>
     <style>
          .container{
               width: 500px;
               height: 500px;
               border: 2px solid black;
               margin:auto;
               margin-top: 20px;
               padding: 10px;
               display: grid;
               grid-template-columns: auto auto auto;
               /* grid-column-gap: 10px;
               grid-row-gap: 10px; */
               grid-gap: 10px 10px;
          }
          .container div{
               background-color: yellow;
               text-align: center;
               font-size: 50px;
               border: 1px solid red;
               padding: 40px;

          } 
          /* #div1{
                grid-column-start: 1;
               grid-column-end: 3;
          }  */
          #div1{
               grid-row-start: 1;
               grid-row-end: 4;
          }

     </style>
</head>
<body>
     <div class="container">
          <div id="div1">1</div>
          <div id="div2">2</div>
          <div id="div3">3</div>
          <div id="div4">4</div>
          <div id="div5">5</div>
          <div id="div6">6</div>
          <div id="div7">7</div>
     </div>
</body>
</html>
