<!DOCTYPE html>
<html lang="en">
<head>
     <title>Forms In HTML</title>
</head>
<body>
     <form>
          <fieldset>
               <legend><h2>Enquiry Form</h2></legend>
          Name: <input type="text" name="name" value="" placeholder="Enter your name..." /> <br><br>
          
          Image: <input type="file" name="image"/>
          <br><br>
          Country: 
          <select> 
               <optgroup label="ASIA">
                    <option value="India">India</option>
                    <option value="korea">Korea</option>
                    <option value="Indonesia">Indonesia</option>
               </optgroup>
           <option value="usa">US</option>
           <option value="russia">Russia</option>
           <option value="china">China</option>
           <option value="israel">Israel</option>
           

          </select><br><br>
          Address: <textarea name="Address" ></textarea> <br><br>
          
          Hobbies: <input type="checkbox" name="hobbies"/> Dancing
           <input type="checkbox" name="hobbies"/> Painting
           <input type="checkbox" name="hobbies"/> Computer


          <br><br>
          Gender: <input type="radio" value="m" name="gender"/> Male
                  <input type="radio" value="f" name="gender"/> Female
                  <input type="radio" value="o" name="gender"/> Other
                  <br><br>
          <input type="submit" value="Submit"/>
          <input type="reset" value="Reset" />
     </fieldset>
     </form>
</body>
</html>
