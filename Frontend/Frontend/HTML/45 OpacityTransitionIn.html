<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Opacity & Transition In Html</title>
     <style>
          .main{
               width: 500px;
               height: 300px;
               margin: auto;
               margin-top: 100px;
               color: white;
               font-size: 50px;
               text-align: center;
               padding-top: 200px;
               background: rgba(0,0,255,0.7);
               opacity: 0.5;
               /* transition: 0.5s; */
          }

          .main:hover{
               background-color: blue;
               opacity: 1;
               transition: 0.5s;

          }
     </style>
</head>
<body>
     <div class="main"><b>alyzer</b></div>

</body>
</html>
