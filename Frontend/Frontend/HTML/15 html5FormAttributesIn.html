<!DOCTYPE html>
<html lang="en">
<head>
     <title>Form Attributes</title>
</head>
<body>
     <form>
          <fieldset>
               <legend><h2>Form Attributes</h2></legend>

                  Name: <input type="text" name="name", value="AyushRaj" readonly=""  disabled="" maxlength="30"
                  placeholder="Enter your name..."> <br><br>
                  Color: <input type="color" name="color"/><br><br>
                  Hobbies: <input type="checkbox" name="Computer">Computer
                           <input type="checkbox" name="Singing">Singing
                           <input type="checkbox" name="Dancing">Dancing
                           <input type="checkbox" name="Other" checked>Other

                  <br><br>
                  Gender: <input type="radio" value="male" name="m" checked> Male
                          <input type="radio" value="f" name="female"> Female
                          <input type="radio" value="o" name="other"> Other 
                          <br>
                          <br>
                  Age: <input type="number" name="number" min="0" max="30"><br><br>
                  Range: <input type="range" min="0" max="100" value="12">

                          <br><br>
          <input type="submit" value="Submit"/>
          <input type="reset" value="Reset"/>

     </fieldset>
     </form>
</body>
</html>
