<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Add To Cart Button</title>
     <style>
          .box{
               width: 400px;
               height: 400px;
               border: 2px solid black;
               margin: auto;
               margin-top: 100px;
               position: relative;
               
          }
          .but{
               width: 100%;
               font-size: 20px;
               color: white;
                background: rgba(0,0,0,0.6);
                position: absolute;
                left: 0px;
                bottom: -30px;
                opacity: 0;
                transition: 0.3s;
          }
          .box:hover .but{
               bottom: 40px;
               opacity: 1;

          }
     </style>
</head>
<body>
     <div class="box">
          <img src="sp.png" alt="Failed!" width="100%" height="100%">
          <input type="button" value="Buy Now!" class="but">
     </div>
</body>
</html>
