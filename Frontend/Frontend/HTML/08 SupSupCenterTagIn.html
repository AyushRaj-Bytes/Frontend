<!DOCTYPE html>
<html lang="en">
<head>
     <title>Sup Sub & Center Tag in HTML</title>
</head>
<body>
     <center>
     <h1>Superscript</h1>
      a <sup>2</sup> + b <sup>2 <sup>3</sup></sup>  = X
      <h1>Subscript</h1>
      log <sub>2</sub> X + 2
      <h1><meter min="0" max="100" value="50"></meter></h1>
     </center>

     <h1><meter min="0" max="100" value="50"></meter></h1>
</body>
</html>
