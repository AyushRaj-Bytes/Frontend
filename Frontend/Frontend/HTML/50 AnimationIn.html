<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Animation Basics In Html</title>
     <style>
          .main{
               width: 600px;
               height: 600px;
               margin: 0 auto;
               margin-top: 50px;
               border: 2px solid black;
               position: relative;
          }
          .inbox{
               width: 200px;
               height: 200px;
               background-color: yellow;
               position: absolute;
               top: 0px;
               left: 0px;
               /* animation-name: box;
               animation-duration: 10s; */
               animation: box 5s 4;
               animation-iteration-count: 2;
               /* animation-fill-mode: both; */
               /* animation-delay: 3s; */
               animation-direction: normal;
          }
          @keyframes box{
               0%{
                    top: 0px;
                    left: 0px;
                    background-color: yellow;
               }
               25%{
                    top: 0px;
                    left: 400px;
                    background-color: red;
               }
               50%{
                    top: 400px;
                    left: 400px;
                    background-color: blue;
               }
               75%{
                    top: 400px;
                    left: 0px;
                    background-color: lightgreen
               }
               100%{
                    top: 0px;
                    left: 0px;
                    background-color: yellow;
               }
          }
     </style>
</head>
<body>
     <div class="main">
          <div class="inbox">

          </div>
     </div>
</body>
</html>
