<!-- Flex -->

<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Flex Diaplay</title>
     <style>
          .main{
               width: 300px;
               height: 300px;
               margin: auto;
               margin-top: 100px;
               border: 2px solid black;
               display: flex;
          }
          .main div{

               width: 20px;
               height: 20px;
               color: red;
               border: 2px solid blue;
          }
     </style>
</head>
<body>
     <div class="main">
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>4</div>
          <div>5</div>
     </div>
</body>
</html>
