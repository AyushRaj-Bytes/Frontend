<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Box Shadow In Html</title>
     <style>
          .main{height: 500px;
               width: 500px;
               margin: auto;
               /* border: 2px solid black; */
               text-align: center;
               color: white;
               font-size: 100px;
               
               /*  R = 0 - 255               
                   G = 0 - 255
                   B = 0 - 255    */
               /* background-color: rgb(0, 0, 0);*/  /*For RGB */
               background-color: RGBA(255, 0, 0, 0.5);  /* For Opacity */

               /* Box Shadow- x-axis, y-axis, Blur, Range, Color  */

               box-shadow: 0px 0px 10px 5px grey;
          }
     </style>
</head>
<body>
     <div class="main">
          alyzer
     </div>
</body>
</html>
