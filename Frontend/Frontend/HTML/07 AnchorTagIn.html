    <h1>Use of anchor tag</h1>
    <h3>
      <a href="https://www.youtube.com" target="_parent"
        >Open Youtube in Same page</a
      >
    </h3>
    <h3>
      <a href="https://www.youtube.com" target="_blank">
        Open Youtube in New Tab</a
      >
    </h3>
