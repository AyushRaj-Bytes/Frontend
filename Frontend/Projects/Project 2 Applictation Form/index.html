<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Project 2: Application Form</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">
          <div class="content">
               <h1>Application Form
                    <span class="web">(Web)</span>
               </h1>
               <form action="">
                    <div class="form_container">
                         <div class="form_flow">
                              <label for="First Name">First Name:</label>
                              <input type="text" name="First Name" id="First Name" >
                          </div>
                          <div class="form_flow">
                              <label for="Last Name">Last Name:</label>
                              <input type="text" name="Last Name" id="Last Name">
                          </div>
                          <div class="form_flow">
                              <label for="Last Name">Email:</label>
                              <input type="email" name="Email" id="Email">
                          </div>
                          <div class="form_flow">
                              <label for="Job_Roles">Job Roles:</label>
                              <select>
                                   <option value="">Select Job Roles-</option>
                                   <option value="Frontend">Frontend</option>
                                   <option value="Frontend">Backend</option>
                                   <option value="Frontend">AI Engineer</option>
                                   <option value="Frontend">Full Stack Develeoper</option>
                              </select>
                          </div>
                          <div class="form_flow">
                              <label for="address">Address: </label>
                              <textarea name="text" id="address"></textarea>
                          </div>
                          <div class="form_flow">
                              <label for="city">City:</label>
                              <input type="text" name="city" id="city">
                          </div>
                          <div class="form_flow">
                              <label for="pin_code">Pin Code:</label>
                              <input type="number" name="pin_code" id="pin_code">
                          </div>
                          <div class="form_flow">
                              <label for="start_date">Start Date:</label>
                              <input type="date" name="start_date" id="start_date">
                          </div>
                          <div class="form_flow">
                              <label for="cv_file">CV:</label>
                              <input type="file" name="cv_file" id="cv_file">
                          </div>
                    </div>
               </form>
               <br><br>
                         <div class="form_flow" style="justify-content: end;">
                             <input type="submit" value="Apply">
                          </div>
          </div>
     </div>
</body>
</html>
